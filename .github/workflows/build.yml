name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust targets
        run: rustup target add i686-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npx tauri build

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: OpenSpeedy-portable
          path: |
            src-tauri/target/release/openspeedy.exe
            src-tauri/target/release/bridge32.exe
            src-tauri/target/release/bridge64.exe
            src-tauri/target/release/speedpatch32.dll
            src-tauri/target/release/speedpatch64.dll
          if-no-files-found: error

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: OpenSpeedy-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
